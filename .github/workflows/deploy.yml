name: Deploy Backend Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Force load bash profile to bring Node, NPM, and PM2 into scope
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            
            # If you are not using NVM, fallback to adding common paths
            export PATH=$PATH:/usr/bin:/usr/local/bin:$HOME/.npm-global/bin

            # 2. Navigate to application directory
            cd ~/applications/rishabhbhard-backend
            
            # 3. Fetch latest changes
            git pull origin main
            
            # 4. Install dependencies
            npm install --production
            
            # 5. Run the memory-optimized build
            NODE_OPTIONS="--max-old-space-size=3072" npm run build
            
            # 6. Restart PM2
            pm2 restart all