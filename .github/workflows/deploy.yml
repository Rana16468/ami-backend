name: Deploy Backend Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Directly inject the actual interactive shell PATH into this session
            # This loads the exact environment you see when you manually log in
            export PATH="/home/ubuntu/.nvm/versions/node/$(node -v 2>/dev/null || echo 'default')/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            
            # Alternative bulletproof method: Source your actual interactive .bashrc file
            # We tell bash to act interactively so it doesn't skip loading profiles
            source ~/.profile 2>/dev/null
            source ~/.bashrc 2>/dev/null

            # 2. Navigate to application directory
            cd ~/applications/rishabhbhard-backend
            
            # 3. Fetch latest changes
            git pull origin main
            
            # 4. Install dependencies (Using absolute command discovery)
            $(which npm) install --production
            
            # 5. Run the memory-optimized build
            NODE_OPTIONS="--max-old-space-size=3072" $(which npm) run build
            
            # 6. Restart PM2
            $(which pm2) restart all