name: Deploy Backend Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # bash -l ব্যবহার করে আপনার সার্ভারের আসল প্রোফাইল লোড করা হচ্ছে যেন npm/pm2 পাওয়া যায়
            bash -l -c '
              # ১. প্রজেক্ট ফোল্ডারে যাওয়া
              cd ~/applications/rishabhbhard-backend
              
              # ২. গিট থেকে লেটেস্ট কোড টানা
              git pull origin main
              
              # ৩. ডিপেন্ডেন্সি ইন্সটল করা
              npm install --omit=dev
              
              # ৪. র‍্যামের সাইজ বাড়িয়ে প্রজেক্ট বিল্ড করা
              NODE_OPTIONS="--max-old-space-size=3072" npm run build
              
              # ৫. PM2 রিস্টার্ট করা
              pm2 restart all
            '